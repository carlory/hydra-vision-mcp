name: Bug report
description: Report a reproducible problem with the MCP server
labels: [bug]
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Package version, operating system, Node.js version, MCP client, upstream model. Omit credentials.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps or tool arguments and a non-sensitive sample, if needed.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include sanitized stderr or MCP error output.
    validations:
      required: true
